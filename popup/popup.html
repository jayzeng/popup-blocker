<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yet Another Popup Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <h1 class="title">Yet Another Popup Blocker</h1>

    <div class="global-row">
      <span class="info-label">Block popups globally:</span>
      <button id="toggleGlobal" class="toggle-global-btn global-on">ON</button>
    </div>

    <div class="setting-row">
      <label for="showBlockedToast" class="info-label">Show block notifications on pages:</label>
      <input id="showBlockedToast" class="setting-checkbox" type="checkbox" />
    </div>

    <div id="coverageStatus" class="coverage-status not-covered"></div>

    <div class="info-container">
      <div class="info-item">
        <span class="info-label">Current site:</span>
        <span id="currentSite" class="info-value">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Popups blocked:</span>
        <span id="blockedCount" class="info-value">0</span>
      </div>
    </div>

    <button id="toggleBlocking" class="toggle-button allowed">Enable Blocking</button>

    <div class="blocked-sites-list">
      <h2 id="sitesListTitle">Blocked Sites</h2>
      <ul id="blockedSitesList"></ul>
      <p id="emptyState">No sites are currently blocked.</p>
    </div>

    <div class="list-section" id="whitelistSection">
      <h2>Always Allowed (Whitelist)</h2>
      <div class="add-site-row">
        <input type="text" id="whitelistInput" placeholder="example.com" />
        <button id="addWhitelistBtn">Add</button>
      </div>
      <ul id="whitelistSitesList"></ul>
      <p id="whitelistEmpty">No sites whitelisted.</p>
    </div>

    <div class="list-section" id="blacklistSection">
      <h2>Always Blocked (Blacklist)</h2>
      <div class="add-site-row">
        <input type="text" id="blacklistInput" placeholder="example.com" />
        <button id="addBlacklistBtn">Add</button>
      </div>
      <ul id="blacklistSitesList"></ul>
      <p id="blacklistEmpty">No sites blacklisted.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
