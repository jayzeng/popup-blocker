<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yet Another Popup Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <h1 class="title">Yet Another Popup Blocker</h1>

    <div id="coverageStatus" class="coverage-status not-covered"></div>

    <div class="info-container">
      <div class="info-item">
        <span class="info-label">Current site:</span>
        <span id="currentSite" class="info-value">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Popups blocked:</span>
        <span id="blockedCount" class="info-value">0</span>
      </div>
    </div>

    <button id="toggleBlocking" class="toggle-button allowed">Enable Blocking</button>

    <div class="blocked-sites-list">
      <h2>Blocked Sites</h2>
      <ul id="blockedSitesList"></ul>
      <p id="emptyState">No sites are currently blocked.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
